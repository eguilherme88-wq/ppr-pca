name: Gerar instaladores

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Configuração do Firebase
        shell: bash
        env: { FIREBASE_CONFIG_JS: "${{ secrets.FIREBASE_CONFIG_JS }}" }
        run: if [ -n "$FIREBASE_CONFIG_JS" ]; then printf '%s\n' "$FIREBASE_CONFIG_JS" > www/firebase-config.js; fi
      - run: npm ci
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/*.exe }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Configuração do Firebase
        shell: bash
        env: { FIREBASE_CONFIG_JS: "${{ secrets.FIREBASE_CONFIG_JS }}" }
        run: if [ -n "$FIREBASE_CONFIG_JS" ]; then printf '%s\n' "$FIREBASE_CONFIG_JS" > www/firebase-config.js; fi
      - run: npm ci
      - run: npx electron-builder --linux AppImage deb --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: Configuração do Firebase
        shell: bash
        env: { FIREBASE_CONFIG_JS: "${{ secrets.FIREBASE_CONFIG_JS }}" }
        run: if [ -n "$FIREBASE_CONFIG_JS" ]; then printf '%s\n' "$FIREBASE_CONFIG_JS" > www/firebase-config.js; fi
      - run: npm ci
      - name: Criar projeto Android
        run: |
          npx cap add android
          mkdir -p assets
          cp www/icons/icon-1024.png assets/icon-only.png
          cp www/icons/icon-1024.png assets/icon-foreground.png
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#1F4A40' --splashBackgroundColor '#EDF1EF' || echo "Ícones padrão mantidos"
          npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Partner-PPR-PCA-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: Partner-PPR-PCA-Android.apk }

  release:
    needs: [windows, linux, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          name: Partner PPR e PCA ${{ github.ref_name }}
          files: out/*
          body: |
            Instaladores do Partner: gerenciamento em PPR e PCA.
            - Windows: Partner-PPR-PCA-Setup-*.exe
            - Linux: .AppImage (qualquer distribuição) ou .deb (Ubuntu/Debian)
            - Android (celular e tablet): Partner-PPR-PCA-Android.apk
            - iPhone, iPad e qualquer navegador: abra o endereço do GitHub Pages e use "Adicionar à Tela de Início".
