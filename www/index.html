<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partner: gerenciamento em PPR e PCA</title>
<meta name="theme-color" content="#1F4D73">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Partner">
<script src="firebase-config.js"></script>
<script src="js/platform.js"></script>
<script>try{var t=localStorage.getItem("ppr-pca-tema");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EF;--surface:#FFFFFF;--surface2:#F5F8F6;--ink:#14261F;--muted:#586A63;--line:#D2DCD8;
  --ppr:#1A6A8C;--ppr-soft:#E0EEF4;--pca:#6D4799;--pca-soft:#EEE7F6;
  --venc:#B42318;--venc-soft:#FCE9E7;--prox:#8F5E00;--prox-soft:#FFF0D3;--ok:#28744A;--ok-soft:#E2F1E7;
  --na:#95A39E;--od:#C62828;--oe:#1560BD;--btn:#1F4A40;--btn-ink:#FFFFFF;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1715;--surface:#16211E;--surface2:#1C2925;--ink:#E4EDE9;--muted:#9BAEA7;--line:#2B3A36;
  --ppr:#72B8D8;--ppr-soft:#15303B;--pca:#BB9EDF;--pca-soft:#2A2238;
  --venc:#F4897D;--venc-soft:#3B1D1A;--prox:#E9B452;--prox-soft:#35290E;--ok:#74CB97;--ok-soft:#163024;
  --na:#6C7C77;--od:#F28B82;--oe:#8AB4F8;--btn:#9FD1C0;--btn-ink:#0F1715;
}}
:root[data-theme="dark"]{
  --bg:#0F1715;--surface:#16211E;--surface2:#1C2925;--ink:#E4EDE9;--muted:#9BAEA7;--line:#2B3A36;
  --ppr:#72B8D8;--ppr-soft:#15303B;--pca:#BB9EDF;--pca-soft:#2A2238;
  --venc:#F4897D;--venc-soft:#3B1D1A;--prox:#E9B452;--prox-soft:#35290E;--ok:#74CB97;--ok-soft:#163024;
  --na:#6C7C77;--od:#F28B82;--oe:#8AB4F8;--btn:#9FD1C0;--btn-ink:#0F1715;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ppr);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;align-self:start;height:100vh;height:100dvh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 18px}
.mark{width:30px;height:30px;border-radius:8px;flex:none;background:linear-gradient(135deg,var(--ppr) 0 50%,var(--pca) 50% 100%)}
.brand b{display:block;font-size:14.5px;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3;margin-top:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:8px;color:var(--muted);text-align:left;white-space:nowrap}
.nav button::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--c,transparent)}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button[aria-current]{background:var(--surface2);color:var(--ink);font-weight:650}
.nav .sep{height:1px;background:var(--line);margin:10px 8px}
main{padding:30px 34px 60px;max-width:1320px;width:100%}
.ph{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.ph h1{margin:0;font-size:27px;line-height:1.15;font-weight:800;letter-spacing:-.015em}
.ph p{margin:6px 0 0;color:var(--muted);max-width:68ch}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:8px;border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);font-weight:600;font-size:14px}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sec:hover{background:var(--surface2)}
.btn.danger{background:var(--venc);border-color:var(--venc);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--ink);font-weight:600;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.link:hover{text-decoration-color:var(--ink)}
.icon{border:0;background:none;padding:4px 6px;border-radius:6px;color:var(--muted);font-size:13px}
.icon:hover{background:var(--surface2);color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px}
.panel h2{font-size:17px;margin:0 0 4px;font-weight:700}
.panel>p.muted{margin:0 0 14px}
.muted{color:var(--muted)}
small.muted{font-size:12.5px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--tc,var(--ink));font-weight:650}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.search{flex:1 1 240px;max-width:360px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12.5px;color:var(--muted);font-weight:650;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r{text-align:right;white-space:nowrap}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:650;white-space:nowrap;line-height:1.6}
.chip.venc,.chip.pend{background:var(--venc-soft);color:var(--venc)}
.chip.prox{background:var(--prox-soft);color:var(--prox)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.na{background:var(--surface2);color:var(--muted)}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:12px;font-weight:700}
.tag.pca{background:var(--pca-soft);color:var(--pca)}
.tag.ppr{background:var(--ppr-soft);color:var(--ppr)}
.sum{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.sum div{display:flex;align-items:baseline;gap:8px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.sum b{font-size:22px;font-weight:800}
.sum .venc b{color:var(--venc)}.sum .prox b{color:var(--prox)}.sum .ok b{color:var(--ok)}.sum .tec b{color:var(--pca)}
.mx-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.mx{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.mx th,.mx td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left}
.mx thead th{position:sticky;top:0;background:var(--surface2);z-index:2;font-weight:650;color:var(--muted);font-size:12.5px;white-space:nowrap}
.mx thead tr:nth-child(2) th{top:34px}
.mx th.g{color:var(--ink);font-size:13px;border-top:4px solid var(--gc)}
.mx .wn{position:sticky;left:0;background:var(--surface);z-index:1;min-width:190px;max-width:240px;padding-left:12px}
.mx thead .wn{z-index:3;background:var(--surface2)}
.mx .wn small{display:block;color:var(--muted);font-size:12px}
.mx td.c{min-width:112px}
.mx .gs{border-left:2px solid var(--line)}
.cell{display:block;padding:5px 8px;border-radius:6px;font-weight:600;font-size:12.5px;white-space:nowrap}
.cell.venc,.cell.pend{background:var(--venc-soft);color:var(--venc)}
.cell.prox{background:var(--prox-soft);color:var(--prox)}
.cell.ok{background:var(--ok-soft);color:var(--ok)}
.cell.na{color:var(--na);font-weight:400}
.cell.flag{box-shadow:inset 0 0 0 2px var(--pca)}
.alist{list-style:none;margin:0;padding:0;max-height:380px;overflow:auto}
.alist li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.alist li:last-child{border-bottom:0}
.alist .t{font-size:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.empty p{margin:0 0 14px}
.banner{padding:10px 14px;border-radius:10px;background:var(--prox-soft);color:var(--prox);margin-bottom:16px;font-size:14px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(8,18,15,.5);display:none;z-index:50;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
.ov.open{display:block}
.sheet{background:var(--surface);border-radius:14px;max-width:760px;margin:0 auto;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet.wide{max-width:980px}
.mh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:18px 22px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-size:20px;font-weight:750}
.mh p{margin:4px 0 0}
.mb{padding:20px 22px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;border-top:1px solid var(--line)}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.fg .full{grid-column:1/-1}
.fld>span{display:block;font-size:13px;font-weight:650;margin-bottom:5px}
.fld>small{display:block;color:var(--muted);font-size:12.5px;margin-top:4px}
.fld input:not([type=checkbox]),.fld select,.fld textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:40px}
.fld textarea{min-height:76px;resize:vertical}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:500;padding:4px 0}
.chk input{width:18px;height:18px;accent-color:var(--btn)}
.chks{display:flex;flex-wrap:wrap;gap:4px 18px}
.chks.col{flex-direction:column;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.agrid{overflow-x:auto}
.agrid table{border-collapse:collapse}
.agrid th{font-size:12.5px;color:var(--muted);font-weight:650;padding:4px;text-align:center}
.agrid th.e{text-align:left;padding-right:10px;white-space:nowrap}
.agrid input{width:60px;padding:7px 6px;text-align:center;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.agrid tr.od th.e{color:var(--od)}.agrid tr.oe th.e{color:var(--oe)}
.req{display:grid;grid-template-columns:minmax(150px,auto) auto 1fr;gap:6px 14px;align-items:center;font-size:14px}
.req .p{font-weight:600}
.audg{display:flex;flex-wrap:wrap;gap:16px}
.audg figure{margin:0;flex:1 1 280px}
.audg figcaption{font-size:13px;font-weight:650;margin-bottom:4px}
.hist h3{font-size:15px;margin:22px 0 8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.on{opacity:1}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.calc .panel{margin:0}
.res{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--surface2)}
.res b{font-size:20px}
.drow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:end}
.prose{max-width:74ch}
.prose h2{font-size:18px;margin:26px 0 6px}
.prose h2:first-child{margin-top:0}
.prose p{margin:0 0 10px}
.prose ul{margin:0 0 10px;padding-left:20px}
@media (max-width:980px){.grid2{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px));border-right:0;border-bottom:1px solid var(--line);z-index:20}
  .brand{padding:0 8px 0 2px}.brand div{display:none}
  .nav{display:flex;gap:2px}.nav .sep{display:none}
  .nav button{width:auto;padding:8px 10px}
  main{padding:20px 14px 50px}
  .ph h1{font-size:23px}
}
@media (max-width:560px){.fg{grid-template-columns:1fr}.req{grid-template-columns:1fr auto}.req .d{grid-column:1/-1;margin-bottom:6px}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.repov{position:fixed;inset:0;z-index:70;background:#DDE3E0;overflow:auto;display:none}
.repov.open{display:block}
.rtb{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.rtb small{color:var(--muted);font-size:12.5px}
.repov .rp{margin:22px auto 48px;box-shadow:0 6px 28px rgba(0,0,0,.14)}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.opt:has(input:checked){border-color:var(--btn);box-shadow:inset 0 0 0 1px var(--btn);background:var(--surface2)}
.opt input{margin-top:3px;width:18px;height:18px;accent-color:var(--btn)}
.opt b{display:block;font-size:14.5px}.opt span{font-size:13px;color:var(--muted)}
.rlist{margin:0;padding-left:20px}.rlist li{margin-bottom:4px}
@media print{
  body>*:not(#rep){display:none!important}
  :root{padding:0!important}body{background:#fff!important}
  #rep{position:static!important;display:block!important;overflow:visible!important;background:#fff!important}
  #rep .rtb{display:none!important}#rep .rp{margin:0!important;box-shadow:none!important}
}

:root{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
.side-tools{margin-top:auto;padding:16px 4px 0;display:flex;flex-direction:column;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px;background:var(--surface)}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;border:0;background:none;padding:6px 4px;border-radius:7px;color:var(--muted);font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--ink);font-weight:650;box-shadow:inset 0 0 0 1px var(--line)}
.seg svg,.tool svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tool{display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;font-size:13px;color:var(--ink);font-weight:500}
.tool:hover,.seg button:hover{color:var(--ink)}
.repov{background:var(--bg)!important}
@media (max-width:860px){.side-tools{margin:0 0 0 6px;padding:0;flex-direction:row;flex:none}.seg span,.tool span{display:none}.seg button{padding:7px 8px}.tool{padding:7px 9px}}

.brand{flex-direction:column;align-items:flex-start;gap:6px;padding:0 6px 20px}
.logo{border:0;background:none;padding:0;display:block;width:100%;max-width:200px;cursor:pointer}
.logo img{display:block;width:100%;height:auto}
.logo-d{display:none!important}
:root[data-theme="dark"] .logo-l{display:none!important}
:root[data-theme="dark"] .logo-d{display:block!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-l{display:none!important}:root:not([data-theme="light"]) .logo-d{display:block!important}}
#empresa{color:var(--muted);font-size:12.5px;line-height:1.3}
#empresa:empty{display:none}
@media (max-width:860px){.brand{padding:0 10px 0 2px;flex:none}.logo{width:92px}#empresa{display:none}}

[hidden]{display:none!important}
.auth{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto}
.authcard{width:100%;max-width:410px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 26px;box-shadow:0 12px 40px rgba(0,0,0,.08)}
.authlogo{width:190px;margin:0 0 22px}.authlogo img{width:100%;height:auto;display:block}
.authcard h1{font-size:22px;margin:0 0 6px;font-weight:800}
.authcard>form>p.muted,.authcard>p.muted{margin:0 0 18px;font-size:14px}
.authcard .fld{display:block;margin-bottom:14px}
.authcard .chk{margin:4px 0 14px;flex-wrap:wrap}
.btn.full{width:100%;justify-content:center;padding:11px 14px}
.aerr{display:none;color:var(--venc);background:var(--venc-soft);padding:8px 10px;border-radius:8px;font-size:13.5px;margin:0 0 12px}
.aerr:not(:empty){display:block}
.me{border-top:1px solid var(--line);padding-top:12px;margin-bottom:4px}
.me:empty{display:none}
.mename{display:flex;flex-direction:column;gap:3px;margin:0 4px 8px;font-size:13.5px;line-height:1.25}
.mename b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meacts{display:flex;gap:6px}.meacts .tool{flex:1}
.nv{display:inline-block;align-self:flex-start;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--surface2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.nv.nv-master{background:var(--ppr-soft);color:var(--ppr);box-shadow:none}
.nv.adm{background:var(--pca-soft);color:var(--pca);box-shadow:none}
code.pw{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--prox-soft);color:var(--prox);padding:2px 7px;border-radius:6px}
.mtx th.gh{text-align:center;border-left:2px solid var(--line);color:var(--ink)}
.mtx th.gh.adm{color:var(--pca)}
.mtx .mc{text-align:center;width:74px}
.mtx td.mc:nth-child(3n+2),.mtx thead tr:nth-child(2) th:nth-child(3n+1){border-left:2px solid var(--line)}
.mtx td.na{color:var(--line)}
.mtx .ck{color:var(--ok);font-weight:800}
.mtx input{width:18px;height:18px;accent-color:var(--btn)}
@media (max-width:860px){.me{border:0;padding:0;margin:0 6px 0 0;display:flex;align-items:center}.mename{display:none}.meacts .tool span{display:none}}
.bio-btn{margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px}.bio-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;margin:14px 0 4px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

main{padding-top:22px!important}

.me:empty{display:none}

.av.adm{background:var(--pca-soft);color:var(--pca);box-shadow:none}

.tb-info b{color:var(--ink);font-size:13.5px}
.tb-info .sep{width:1px;height:12px;background:var(--line)}
.tb-right{display:flex;align-items:center;gap:12px;flex:none}
.tb-right>.tool{padding:7px 11px}
.sobre h2{font-size:18px;margin:0 0 6px}

<script>
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const pd=s=>{if(!s)return null;const[y,m,d]=String(s).split('-').map(Number);return y?new Date(y,m-1,d):null};
function addM(s,n){const d=pd(s);if(!d)return null;const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+Number(n));const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)}
const diffDays=(a,b)=>Math.round((pd(a)-pd(b))/86400000);
const fmt=s=>{if(!s)return '—';const[y,m,d]=s.split('-');return `${d}/${m}/${y}`};
const fmtS=s=>{if(!s)return '—';const[y,m,d]=s.split('-');return `${d}/${m}/${y.slice(2)}`};
const num=(n,d=1)=>(n==null||!isFinite(n))?'—':Number(n).toLocaleString('pt-BR',{maximumFractionDigits:d,minimumFractionDigits:0});
const norm=s=>String(s||'').trim().toLowerCase();
const byData=(a,b)=>(a.data||'').localeCompare(b.data||'')||(a.criadoEm||'').localeCompare(b.criadoEm||'');
const byNome=(a,b)=>(a.nome||'').localeCompare(b.nome||'','pt-BR');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),3200)}

/* ---------- referências técnicas ---------- */
const F=[500,1000,2000,3000,4000,6000,8000];
const RESP={
  pff:{n:'Peça semifacial filtrante (PFF)',fpa:10},
  semi:{n:'Peça semifacial com filtros',fpa:10},
  facial:{n:'Peça facial inteira com filtros',fpa:100},
  mot_semi:{n:'Purificador motorizado com peça semifacial',fpa:50},
  mot_capuz:{n:'Purificador motorizado com capuz ou capacete',fpa:25},
  mot_facial:{n:'Purificador motorizado com peça facial inteira',fpa:1000},
  linha_semi:{n:'Linha de ar comprimido, semifacial, fluxo contínuo',fpa:50},
  linha_facial:{n:'Linha de ar comprimido, facial inteira, pressão positiva',fpa:1000},
  linha_fuga:{n:'Linha de ar, facial inteira, pressão positiva, com cilindro de fuga',fpa:10000,ipvs:true},
  autonomo:{n:'Máscara autônoma, facial inteira, pressão positiva',fpa:10000,ipvs:true}
};
const RESP_OPTS=Object.entries(RESP).map(([k,v])=>[k,`${v.n} (FPA ${v.fpa.toLocaleString('pt-BR')})`]);
const PROT=['Plugue de inserção de espuma','Plugue de inserção pré-moldado','Plugue moldado individualmente','Concha (abafador)','Concha acoplada ao capacete','Semiauricular (banda)'];
const TIPOS_AUD=['Admissional','Periódica (6º mês após admissão)','Periódica anual','Mudança de função','Retorno ao trabalho','Demissional','Complementar'];

/* ---------- estado ---------- */
const COLS=['trabalhadores','audiometrias','ensaios','epis','treinamentos','ruido','agentes','usuarios'];
const DEF_CFG={empresa:'',cnpj:'',admPPR:'',coordPCA:'',medico:'',perEnsaio:12,perTreino:12,perAptidao:12,alerta:30,
  sstTermosPCA:'PCA, conservação auditiva, proteção auditiva, protetor auditivo, protetor auricular, ruído, perda auditiva, PAIR',
  sstTermosPPR:'PPR, proteção respiratória, respirador, máscara, ensaio de vedação, PFF, EPR',sstOverride:{},
  sstEpiPCA:'protetor auricular, protetor auditivo, abafador, concha, plug, plugue, tampão auricular, tampão de ouvido, protetor de inserção',
  sstEpiPPR:'respirador, máscara, PFF, filtro para respirador, cartucho, semifacial, facial inteira, peça facial, EPR, linha de ar',
  senhaPadrao:'Partner@123',acessos:null,trial:{ativo:false,inicio:'',dias:30,licenciado:false}};
const state={data:{},config:{...DEF_CFG},view:'painel',sub:{pca:'aud',ppr:'ved'},q:{},ready:false,mode:'db',readonly:false,
  calc:{crit:'5',rows:[{l:'',t:''}],c:'',lt:'',ipvs:false,nen:'',nrr:''}};
COLS.forEach(c=>state.data[c]=[]);
const D=c=>{const a=state.data[c]||[];if(!state.asOf)return a;if(c==='trabalhadores')return a.filter(w=>!w.admissao||w.admissao<=state.asOf);return a.filter(r=>!r.data||r.data<=state.asOf)};
let db=null,downloads=null;

/* ---------- persistência ---------- */
const LKEY='ppr-pca-controle-v1';
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LKEY)||'null');if(j){COLS.forEach(c=>state.data[c]=j.data?.[c]||[]);state.config={...DEF_CFG,...(j.config||{})};state.sst=j.sst||null}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify({data:state.data,config:state.config,sst:state.sst||null}))}catch(e){}}
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function writeErr(e){
  if(e?.code==='invalid_argument'){state.readonly=true;toast('Você não tem permissão para alterar estes dados.');render()}
  else if(e?.code==='quota_exceeded')toast('Limite de registros atingido. Exporte e remova registros antigos para continuar.');
  else toast('Não foi possível salvar: '+(e?.message||'erro desconhecido'));
  throw e;
}
const store={
  async add(col,obj){obj.criadoEm=new Date().toISOString();
    if(db){try{await db.collection(col).add(obj)}catch(e){writeErr(e)}}
    else{obj.id=newId();state.data[col].push(obj);saveLocal();render()}},
  async put(col,id,obj){const o={...obj};delete o.id;
    if(db){try{await db.doc(col+'/'+id).set(o)}catch(e){writeErr(e)}}
    else{const a=state.data[col];const i=a.findIndex(x=>x.id===id);if(i>=0)a[i]={...o,id};saveLocal();render()}},
  async del(col,id){
    if(db){try{await db.doc(col+'/'+id).delete()}catch(e){writeErr(e)}}
    else{state.data[col]=state.data[col].filter(x=>x.id!==id);saveLocal();render()}},
  async cfg(c){state.config=c;
    if(db){try{await db.doc('config/geral').set(c)}catch(e){writeErr(e)}}
    else{saveLocal();render()}}
};

function st(due){if(!due)return 'pend';const d=diffDays(due,state.asOf||today());if(d<0)return 'venc';if(d<=Number(state.config.alerta||30))return 'prox';return 'ok'}

// Audiometria (NR-7, Anexo II)
const val=(e,f)=>{const v=e?.[f];return(v===''||v==null||isNaN(v))?null:Number(v)};
function avg(e,fs){const v=fs.map(f=>val(e,f));return v.some(x=>x==null)?null:v.reduce((a,b)=>a+b,0)/v.length}
const hasData=e=>F.some(f=>val(e,f)!=null);
const earNormal=e=>F.every(f=>val(e,f)==null||val(e,f)<=25);
function classEar(e){
  if(!hasData(e))return null;
  if(earNormal(e))return 'normal';
  const hi=[3000,4000,6000].some(f=>val(e,f)>25);
  const lo=avg(e,[500,1000,2000]),ha=avg(e,[3000,4000,6000]);
  if(hi&&(lo==null||ha==null||ha>lo))return 'pair';
  return 'alterado';
}
function compareEar(ref,seq){
  if(!hasData(ref)||!hasData(seq))return null;
  const d=f=>{const a=val(seq,f),b=val(ref,f);return a!=null&&b!=null?a-b:null};
  const dAvg=fs=>{const a=avg(seq,fs),b=avg(ref,fs);return a!=null&&b!=null?a-b:null};
  if(earNormal(ref)){
    const m=dAvg([3000,4000,6000]);
    if((m!=null&&m>=10)||[3000,4000,6000].some(f=>d(f)>=15))return 'desencadeamento';
  }else{
    const a=dAvg([500,1000,2000]),b=dAvg([3000,4000,6000]);
    if((a!=null&&a>=10)||(b!=null&&b>=10)||F.some(f=>d(f)>=15))return 'agravamento';
  }
  return 'estavel';
}
function refFor(e){
  const ex=byW('audiometrias',e.trabId);
  if(e.referencia)return null;
  const prior=ex.filter(x=>x.id!==e.id&&byData(x,e)<=0);
  const refs=prior.filter(x=>x.referencia);
  const ref=refs.length?refs[refs.length-1]:ex[0];
  return ref&&ref.id!==e.id?ref:null;
}
function audInfo(id){
  const ex=byW('audiometrias',id);
  if(!ex.length)return{ex};
  const last=ex[ex.length-1];const ref=refFor(last);
  const cmp=ref?{od:compareEar(ref.od,last.od),oe:compareEar(ref.oe,last.oe)}:null;
  const refEff=ref||last;
  return{ex,last,ref:refEff,cmp};
}
const CL={normal:'Normal',pair:'Sugestivo de PAIR',alterado:'Alterado'};
const CLs={normal:'ok',pair:'venc',alterado:'prox'};

// Ruído
function nen(r){const d=Number(r?.dose)/100;if(!(d>0))return null;const q=String(r.criterio||'').includes('q=5')?5:3;return 85+q*Math.log2(d)}
function ruidoGHE(g){const a=D('ruido').filter(r=>norm(r.ghe)===norm(g)).sort(byData);return a[a.length-1]||null}
function nenSt(n){return n==null?'na':n>=85?'venc':n>=80?'prox':'ok'}
function nenTxt(n){return n==null?'Sem avaliação':n>=85?'Acima do limite':n>=80?'Nível de ação':'Abaixo do nível de ação'}
// Agentes químicos
function agentesGHE(g){const m={};D('agentes').filter(a=>norm(a.ghe)===norm(g)).sort(byData).forEach(a=>m[norm(a.agente)]=a);return Object.values(m)}
function fpminGHE(g){if(!g)return null;const ag=agentesGHE(g);if(!ag.length)return null;let fp=0,ipvs=false;ag.forEach(a=>{const f=Number(a.concentracao)/Number(a.lt);if(isFinite(f))fp=Math.max(fp,f);if(a.ipvs)ipvs=true});return{fp,ipvs}}
function gheList(){const m=new Map();[...D('trabalhadores'),...D('ruido'),...D('agentes')].forEach(r=>{if(r.ghe&&!m.has(norm(r.ghe)))m.set(norm(r.ghe),r.ghe.trim())});return[...m.values()].sort((a,b)=>a.localeCompare(b,'pt-BR'))}

function treino(id,p){const mt=x=>x.programa===p||x.programa==='PCA e PPR',lim=state.asOf;
  const sstR=sstFor(id).filter(x=>x.realizado&&mt(x)&&x.data&&(!lim||x.data<=lim));
  const t=[...byW('treinamentos',id).filter(mt),...sstR].sort(byData);const l=t[t.length-1];const nx=proxPlano(id,p);
  const note=nx?`. Previsto no plano anual do Sistema SST para ${planLabel(nx)} (${nx.status.toLowerCase()})`:'';
  if(!l)return{s:'pend',det:'Sem treinamento registrado'+note,txt:nx?'Previsto '+planLabel(nx):undefined,plan:nx};
  const due=addM(l.data,state.config.perTreino);
  return{s:st(due),due,plan:nx,det:'Último em '+fmt(l.data)+(l.origem?` (Sistema SST${l.estimada?', data estimada pelo mês do plano':''})`:'')+note}}
function epiSt(id,p,w){
  const e=[...byW('epis',id).filter(x=>x.programa===p),...(sstIndex().epiW.get(id)||[]).filter(x=>x.programa===p&&x.data&&(!state.asOf||x.data<=state.asOf))].sort(byData);const l=e[e.length-1];
  if(!l)return{s:'pend',det:'Sem registro de entrega'+(state.sst?' no módulo EPI do Sistema SST':''),txt:'Sem entrega'};
  const nome=p==='PPR'?(RESP[l.tipo]?.n||l.tipo||''):(l.tipo||'');
  const r={s:'ok',txt:'Entregue '+fmtS(l.data),det:`${l.modelo||nome} (CA ${l.ca||'não informado'}), entregue em ${fmt(l.data)}${l.sst?' pelo módulo EPI do Sistema SST':''}`};
  if(l.vidaUtil){const tr=addD(l.data,l.vidaUtil);if(st(tr)==='venc'){r.s='prox';r.txt='Trocar';r.det+=`. Vida útil de ${l.vidaUtil} dias encerrada em ${fmt(tr)}`}}
  if(l.validadeCA){const s=st(l.validadeCA);if(s==='venc'){r.s='prox';r.txt='CA vencido';r.det+=`. CA vencido em ${fmt(l.validadeCA)}; próxima entrega deve ter CA válido`}else if(s==='prox'){r.s='prox';r.txt='CA vence '+fmtS(l.validadeCA);r.det+=`. CA vence em ${fmt(l.validadeCA)}`}}
  if(p==='PPR'&&w){const need=fpminGHE(w.ghe),tp=RESP[l.tipo];
    if(need&&tp){if(need.ipvs&&!tp.ipvs){r.s='venc';r.txt='Inadequado';r.det+='. O GHE tem atmosfera IPVS: exige máscara autônoma ou linha de ar com cilindro de fuga'}
      else if(tp.fpa<need.fp){r.s='venc';r.txt='FPA insuficiente';r.det+=`. FPA ${num(tp.fpa,0)} menor que o FP mínimo ${num(need.fp)} do GHE`}}}
  return r;
}
const MCOLS=[{k:'aud',l:'Audiometria',p:'PCA'},{k:'trPCA',l:'Treinamento',p:'PCA'},{k:'prot',l:'Protetor',p:'PCA'},
  {k:'apto',l:'Aptidão médica',p:'PPR'},{k:'ved',l:'Ensaio de vedação',p:'PPR'},{k:'trPPR',l:'Treinamento',p:'PPR'},{k:'resp',l:'Respirador',p:'PPR'}];
function reqs(w){
  const c=state.config,R={};
  if(inProg(w,'PCA')){
    const a=audInfo(w.id);
    if(!a.last)R.aud={s:'pend',det:'Audiometria admissional (de referência) não registrada',txt:'Sem exame'};
    else{const due=addM(a.last.data,a.ex.length===1?6:12);R.aud={s:st(due),due,det:`Último exame em ${fmt(a.last.data)} (${a.last.tipo||'tipo não informado'}); próximo até ${fmt(due)}`};
      if(a.cmp){const k=[a.cmp.od,a.cmp.oe];if(k.includes('agravamento')||k.includes('desencadeamento')){R.aud.flag=`Sugestivo de ${k.includes('agravamento')?'agravamento':'desencadeamento'} de PAIR no exame de ${fmt(a.last.data)}`}}}
    R.trPCA=treino(w.id,'PCA');R.prot=epiSt(w.id,'PCA');
  }
  if(inProg(w,'PPR')){
    const ap=w.aptoResp&&(!state.asOf||w.aptoResp<=state.asOf)?w.aptoResp:null;
    if(ap){const due=addM(ap,c.perAptidao);R.apto={s:st(due),due,det:`Avaliação em ${fmt(ap)}; renovar até ${fmt(due)}`}}
    else R.apto={s:'pend',det:'Sem avaliação médica para uso de respirador'};
    const en=byW('ensaios',w.id),le=en[en.length-1];
    if(!le)R.ved={s:'pend',det:'Sem ensaio de vedação registrado',txt:'Sem ensaio'};
    else if(le.resultado==='Reprovado')R.ved={s:'venc',txt:'Reprovado',det:`Reprovado em ${fmt(le.data)}. Repetir com outro modelo ou tamanho antes de liberar o uso`};
    else{const due=addM(le.data,c.perEnsaio);R.ved={s:st(due),due,det:`${le.respirador||RESP[le.tipoResp]?.n||'Respirador'}${le.tamanho?' tam. '+le.tamanho:''}, aprovado em ${fmt(le.data)}`}}
    R.trPPR=treino(w.id,'PPR');R.resp=epiSt(w.id,'PPR',w);
  }
  return R;
}
function cellTxt(r){if(r.txt&&(r.s!=='ok'||!r.due))return r.txt;if(!r.due)return r.s==='pend'?'Pendente':'Em dia';return(r.s==='venc'?'Venceu ':r.s==='prox'?'Vence ':'Até ')+fmtS(r.due)}
function stLabel(s){return{venc:'Vencido',pend:'Pendente',prox:'Atenção',ok:'Em dia',na:'—'}[s]}

function alerts(){
  const ws=D('trabalhadores').filter(ativo).sort(byNome);const out=[];let venc=0,prox=0,ok=0;
  ws.forEach(w=>{const R=reqs(w);MCOLS.forEach(c=>{const r=R[c.k];if(!r)return;
    if(r.s==='venc'||r.s==='pend'){venc++;out.push({p:c.p,s:'venc',w,t:`${c.p}, ${c.l.toLowerCase()}: ${r.det}`})}
    else if(r.s==='prox'){prox++;out.push({p:c.p,s:'prox',w,t:`${c.p}, ${c.l.toLowerCase()}: ${r.det}`})}else ok++;
    if(r.flag)out.push({p:'PCA',s:'tec',w,t:r.flag+'. Encaminhar ao médico do PCMSO para avaliação e emissão da conduta.'});
  })});
  gheList().forEach(g=>{
    const n=nen(ruidoGHE(g));const wsG=ws.filter(w=>norm(w.ghe)===norm(g));
    if(n!=null&&n>=85)out.push({p:'PCA',s:'tec',g,t:`GHE ${g}: NEN de ${num(n)} dB(A), acima do limite de 85 dB(A). Priorizar controle na fonte e no meio; proteção auditiva obrigatória.`});
    else if(n!=null&&n>=80)out.push({p:'PCA',s:'tec',g,t:`GHE ${g}: NEN de ${num(n)} dB(A), no nível de ação. Manter os expostos no PCA com monitoramento.`});
    if(n!=null&&n>=80)wsG.filter(w=>!inProg(w,'PCA')).forEach(w=>out.push({p:'PCA',s:'venc',w,t:`Exposto a ${num(n)} dB(A) no GHE ${g} e fora do PCA.`}));
    const f=fpminGHE(g);
    if(f&&(f.fp>1||f.ipvs))wsG.filter(w=>!inProg(w,'PPR')).forEach(w=>out.push({p:'PPR',s:'venc',w,t:`GHE ${g} exige proteção respiratória (FP mínimo ${num(f.fp)}${f.ipvs?', IPVS':''}) e o trabalhador está fora do PPR.`}));
  });
  const order={venc:0,tec:1,prox:2};out.sort((a,b)=>order[a.s]-order[b.s]);
  return{out,venc,prox,ok,tec:out.filter(a=>a.s==='tec').length};
}

function fieldHTML(f,v,isNew){
  const id='f_'+f.k,cls='fld'+(f.full?' full':''),req=f.req?' required':'';
  const hint=f.hint?`<small>${esc(f.hint)}</small>`:'';
  if(v===undefined&&isNew)v=f.def==='today'?today():f.def;
  const opt=o=>Array.isArray(o)?o:[o,o];
  switch(f.t){
   case 'textarea':return `<label class="${cls}"><span>${f.l}</span><textarea id="${id}" name="${f.k}">${esc(v)}</textarea>${hint}</label>`;
   case 'select':return `<label class="${cls}"><span>${f.l}</span><select id="${id}" name="${f.k}"${req}>${f.req||f.def?'':'<option value="">Selecione</option>'}${f.opts.map(o=>{const[a,b]=opt(o);return `<option value="${esc(a)}"${a===v?' selected':''}>${esc(b)}</option>`}).join('')}</select>${hint}</label>`;
   case 'check':return `<div class="${cls}"><label class="chk"><input type="checkbox" name="${f.k}"${v?' checked':''}> ${f.l}</label>${hint}</div>`;
   case 'multi':return `<fieldset class="${cls}" style="border:0;padding:0;margin:0"><span style="display:block;font-size:13px;font-weight:650;margin-bottom:5px">${f.l}</span><div class="chks">${f.opts.map(o=>{const[a,b]=opt(o);return `<label class="chk"><input type="checkbox" name="${f.k}" value="${a}"${(v||[]).includes(a)?' checked':''}> ${b}</label>`}).join('')}</div>${hint}</fieldset>`;
   case 'worker':{const ws=D('trabalhadores').filter(w=>ativo(w)||w.id===v).sort(byNome);
     return `<label class="${cls}"><span>${f.l}</span><select id="${id}" name="${f.k}"${req}><option value="">Selecione</option>${ws.map(w=>`<option value="${w.id}"${w.id===v?' selected':''}>${esc(w.nome)}${w.matricula?' ('+esc(w.matricula)+')':''}</option>`).join('')}</select></label>`}

function audiogram(ref,last,ear){
  const Wd=320,H=230,L=38,T=14,R=12,B=28;const col=ear==='od'?'var(--od)':'var(--oe)';
  const x=i=>L+i*(Wd-L-R)/(F.length-1),y=v=>T+((v+10)/130)*(H-T-B);
  let g=`<rect x="${L}" y="${y(-10)}" width="${Wd-L-R}" height="${y(25)-y(-10)}" fill="var(--ok-soft)"/>`;
  for(let v=-10;v<=120;v+=10)g+=`<line x1="${L}" x2="${Wd-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="${v===25?1.5:.6}"${v===25?' stroke-dasharray="4 3"':''}/>${v%20===0?`<text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`:''}`;
  F.forEach((f,i)=>g+=`<line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H-B}" stroke="var(--line)" stroke-width=".6"/><text x="${x(i)}" y="${H-B+16}" text-anchor="middle" font-size="10" fill="var(--muted)">${f>=1000?f/1000+'k':f}</text>`);
  const series=(o,dash,op)=>{const pts=F.map((f,i)=>{const v=val(o,f);return v==null?null:[x(i),y(Math.max(-10,Math.min(120,v)))]});let d='';let pen=false;pts.forEach(p=>{if(!p){pen=false;return}d+=(pen?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)+' ';pen=true});
    const mk=pts.filter(Boolean).map(p=>ear==='od'?`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="var(--surface)" stroke="${col}" stroke-width="1.8" opacity="${op}"/>`:`<path d="M${p[0]-4} ${p[1]-4}L${p[0]+4} ${p[1]+4}M${p[0]+4} ${p[1]-4}L${p[0]-4} ${p[1]+4}" stroke="${col}" stroke-width="2" opacity="${op}"/>`).join('');
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="1.8"${dash?' stroke-dasharray="5 4"':''} opacity="${op}"/>${mk}`};
  if(ref&&ref!==last)g+=series(ref[ear],true,.45);
  if(last)g+=series(last[ear],false,1);
  return `<svg viewBox="0 0 ${Wd} ${H}" width="100%" role="img" aria-label="Audiograma ${ear==='od'?'orelha direita':'orelha esquerda'}"><text x="8" y="${T+(H-T-B)/2}" font-size="10" fill="var(--muted)" transform="rotate(-90 8 ${T+(H-T-B)/2})" text-anchor="middle">dB(NA)</text>${g}</svg>`;
}

 normas(){return head('Base normativa','Resumo das exigências usadas nas regras do sistema. Confira sempre o texto vigente das normas e o PGR e o PCMSO da empresa.')+`<div class="panel prose">
  <h2>Programa de Conservação Auditiva</h2>
  <p>O PCA integra o gerenciamento de riscos (NR-1, PGR) e o controle médico (NR-7, PCMSO). A avaliação da exposição segue a NR-9 e a NR-15, Anexo 1, que fixa 85 dB(A) para 8 horas com incremento de duplicação de dose q=5. A NHO-01 da Fundacentro usa q=3 e é a metodologia de referência. O nível de ação corresponde à dose de 50%, ou 80 dB(A).</p>
  <p>A NR-7, Anexo II, determina audiometria na admissão, no 6º mês após a admissão, anualmente a partir de então e na demissão, com repouso auditivo mínimo de 14 horas. O primeiro exame é a referência; os seguintes são sequenciais.</p>
  <ul><li>Referência normal (até 25 dB(NA) em todas as frequências): é sugestivo de desencadeamento de PAIR quando a média de 3, 4 e 6 kHz piora 10 dB ou mais, ou quando uma dessas frequências piora 15 dB ou mais.</li>
  <li>Referência alterada: é sugestivo de agravamento quando a média de 0,5, 1 e 2 kHz ou a de 3, 4 e 6 kHz piora 10 dB ou mais, ou quando qualquer frequência piora 15 dB ou mais.</li></ul>
  <p>A classificação automática é apenas triagem. O diagnóstico e a conduta são do médico responsável pelo PCMSO.</p>
  <h2>Programa de Proteção Respiratória</h2>
  <p>O uso de respiradores exige PPR conforme a Instrução Normativa MTb nº 1/1994 e as recomendações da Fundacentro no guia “Programa de Proteção Respiratória”. O programa deve ter um administrador e cobrir avaliação dos riscos, seleção adequada, avaliação médica, treinamento, ensaio de vedação, inspeção, higienização, manutenção e guarda.</p>
  <ul><li>Seleção: o fator de proteção atribuído (FPA) do respirador deve ser igual ou maior que o fator de proteção mínimo (concentração ÷ limite). Atmosferas IPVS exigem máscara autônoma ou linha de ar com cilindro de fuga, ambas com pressão positiva.</li>

function updateCalc(){
  const c=state.calc,q=Number(c.crit);const el=$('#r-dose');if(!el)return;
  let dose=0,ok=0,over115=false;c.rows.forEach(r=>{const l=Number(r.l),t=Number(r.t);if(r.l===''||r.t===''||!(t>0))return;ok++;if(l>115)over115=true;if(l<80)return;const Tn=8/Math.pow(2,(l-85)/q);dose+=t/Tn});
  if(!ok)el.innerHTML='<span class="muted">Preencha ao menos um nível e um tempo.</span>';
  else{const n=dose>0?85+q*Math.log2(dose):null;el.innerHTML=`Dose: <b>${num(dose*100)}%</b><br>NEN: <b>${n==null?'abaixo de 80':num(n)}</b> dB(A) <span class="chip ${nenSt(n)}">${nenTxt(n==null?79:n)}</span>${over115?'<br><span style="color:var(--venc)">Nível acima de 115 dB(A): exposição não permitida sem proteção adequada (NR-15).</span>':''}<br><small class="muted">Níveis abaixo de 80 dB(A) não entram no cálculo (limiar de integração).</small>`}
  const cc=Number(c.c),lt=Number(c.lt),rr=$('#r-resp');
  if(!(cc>0&&lt>0))rr.innerHTML='<span class="muted">Informe a concentração e o limite.</span>';
  else{const fp=cc/lt;const ls=Object.values(RESP).map(x=>({...x,ok:x.fpa>=fp&&(!c.ipvs||x.ipvs)}));
    rr.innerHTML=`FP mínimo: <b>${num(fp,2)}</b>${fp<=1&&!c.ipvs?'<br><small class="muted">Concentração dentro do limite. Avalie a necessidade pelo PGR e pelo nível de ação.</small>':''}<ul style="margin:10px 0 0;padding-left:18px;font-size:13.5px">${ls.map(x=>`<li style="${x.ok?'':'color:var(--muted);text-decoration:line-through'}">${esc(x.n)} (FPA ${num(x.fpa,0)})</li>`).join('')}</ul>`}
  const nn=Number(c.nen),nr=Number(c.nrr),rp=$('#r-prot');
  if(c.nen===''||c.nrr==='')rp.innerHTML='<span class="muted">Informe a NEN e o NRRsf.</span>';
  else{const e=nn-nr;const s=e>=85?['venc','Proteção insuficiente']:e>=80?['prox','No nível de ação']:e<70?['prox','Possível superproteção']:['ok','Proteção adequada'];
    rp.innerHTML=`Nível estimado com protetor: <b>${num(e)}</b> dB(A) <span class="chip ${s[0]}">${s[1]}</span><br><small class="muted">Faixa recomendada entre 70 e 80 dB(A). Abaixo de 70 dB(A) o isolamento pode prejudicar a comunicação e a percepção de alarmes.</small>`}
}

function aerr(m){const e=$('#aerr');if(e){e.textContent=m;e.style.display=m?'block':'none'}}
async function authSubmit(f){
  const v=n=>(f.elements[n]?.value||'').trim();
  if(f.id==='f-setup'){
    const nome=v('nome'),login=nrm(v('login')),s1=f.elements.s1.value,s2=f.elements.s2.value;
    if(!nome||!login)return aerr('Preencha nome e login.');if(!pwOk(s1))return aerr(PWRULE);if(s1!==s2)return aerr('As senhas não conferem.');
    const salt=newSalt();
    try{
      if(f.elements.trial.checked)await store.cfg({...state.config,trial:{ativo:true,inicio:today(),dias:Math.max(1,Number(v('dias'))||30),licenciado:false}});
      await store.add('usuarios',{nome,login,nivel:'Administrador',situacao:'Ativo',salt,hash:hashPw(s1,salt),trocarSenha:false,senhaProvisoria:''});
      state.authMsg='Administrador criado. Entre com o login e a senha.';render();
    }catch(_){aerr('Não foi possível criar o administrador.')}
    return;
  }
  if(f.id==='f-login'){
    const login=nrm(v('login')),senha=f.elements.senha.value;state.authMsg='';
    const u=(state.data.usuarios||[]).find(x=>nrm(x.login)===login);
    const ok=u&&(u.trocarSenha?senha===u.senhaProvisoria:(u.hash&&hashPw(senha,u.salt)===u.hash));
    if(!ok)return aerr('Login ou senha incorretos.');
    if(u.situacao==='Inativo')return aerr('Este usuário está inativo. Procure o administrador.');
    if(trialInfo().expirado&&u.nivel!=='Administrador')return aerr('O período de teste terminou. Procure o administrador.');
    setSession(u.id);try{await store.put('usuarios',u.id,{...u,ultimoAcesso:new Date().toISOString()})}catch(_){}render();
    if(state.bioOk&&!u.trocarSenha&&!Platform.bioSaved()&&!sessionStorage.getItem('ppr-pca-bio-ofertada')){try{sessionStorage.setItem('ppr-pca-bio-ofertada','1')}catch(_){}setTimeout(()=>openBio(true),400)}
    return;
  }
  if(f.id==='f-troca'){
    const u=me();if(!u)return;const s1=f.elements.s1.value,s2=f.elements.s2.value;
    if(!pwOk(s1))return aerr(PWRULE);if(s1!==s2)return aerr('As senhas não conferem.');if(s1===u.senhaProvisoria)return aerr('A nova senha precisa ser diferente da senha padrão.');
    const salt=newSalt();try{await store.put('usuarios',u.id,{...u,salt,hash:hashPw(s1,salt),trocarSenha:false,senhaProvisoria:'',senhaAlteradaEm:new Date().toISOString()});toast('Senha criada. Bem-vindo!');render()}catch(_){aerr('Não foi possível salvar a senha.')}
  }
}

function svgNEN(rows){

   <div class="sobre-grid">${row('Versão',SISTEMA.versao)}${row('Data da versão',fmt(SISTEMA.data))}${row('Licença',esc(lic))}${row('Empresa usuária',esc(state.config.empresa||'Não informada'))}${row('Armazenamento',state.mode==='local'?'Neste aparelho':state.mode==='firebase'?'Firebase ('+esc(Platform.projectId())+')':'Nuvem do Claude')}${row('Plataforma',Platform.plataforma())}${row('Biometria',state.bioOk?(Platform.bioSaved()?'Ativa para '+esc(Platform.bioSaved().nome):'Disponível, não ativada'):'Não disponível neste aparelho')}${row('Integração SST',state.sst?'Ativa, sincronizada em '+fmt(state.sst.syncedAt.slice(0,10)):'Não sincronizada')}</div>

   <p>NR-1 (PGR), NR-6 (EPI), NR-7 e Anexo II (PCMSO e audiometria), NR-9, NR-15 Anexo 1, NHO-01 da Fundacentro, Instrução Normativa MTb nº 1/1994 e guia Programa de Proteção Respiratória da Fundacentro. As classificações automáticas são apoio técnico e não substituem a avaliação do profissional responsável.</p>
   <h3>Direitos reservados</h3>
   <p><b>${copyTxt()}</b></p>
   <p>Este software, sua marca, código-fonte, layout e documentação são protegidos pela Lei nº 9.609/1998 (Lei de Software) e pela Lei nº 9.610/1998 (Direitos Autorais). São proibidas a cópia, a distribuição, a modificação, a sublicença e a engenharia reversa sem autorização por escrito do titular.</p>
   <h3>Proteção de dados</h3>
   <p>O sistema trata dados pessoais e dados de saúde, como resultados de audiometria, considerados sensíveis pela Lei nº 13.709/2018 (LGPD). A empresa usuária é a controladora desses dados e responde pela base legal, pelo controle de acesso e pela guarda das informações.</p>
  </div>
  <div class="mf">${state.mode==='firebase'&&isAdm()?'<button class="btn sec" data-a="org-logout">Desconectar este aparelho da conta da empresa</button>':''}<button class="btn" data-a="close">Fechar</button></div>`);
}
/* ---------- render e eventos ---------- */
let rq=0;
function render(){
  SSTIDX=null;
  document.querySelectorAll('.nav [data-v]').forEach(b=>b.dataset.v===state.view?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
  $('#empresa').textContent=state.config.empresa||'';
  const m=$('#main');
  if(!state.ready){m.innerHTML='<div class="empty"><p>Carregando dados…</p></div>';$('.app').hidden=false;return}
  if(authGate())return;
  meBox();tbInfo();
  document.querySelectorAll('.nav [data-v]').forEach(b=>{b.hidden=!pode(VIEWMOD[b.dataset.v])});
  if(!pode(VIEWMOD[state.view])){const f=Object.keys(VIEWMOD).find(v=>pode(VIEWMOD[v]));state.view=f||'painel';document.querySelectorAll('.nav [data-v]').forEach(b=>b.dataset.v===state.view?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'))}
  const ae=document.activeElement,aid=ae&&ae.id,sel=ae&&ae.selectionStart;
  const ban=state.mode==='local'?'<div class="banner">Os dados estão sendo guardados apenas neste aparelho. Configure o Firebase para compartilhar entre computadores, celulares e tablets.</div>':state.readonly?'<div class="banner">Você está vendo os dados em modo de leitura.</div>':'';
  const T=trialInfo();const tb=T.ativo?(T.expirado?`<div class="banner" style="background:var(--venc-soft);color:var(--venc)">O período de teste terminou em ${fmt(T.fim)}. Apenas o administrador está conseguindo entrar. Estenda o prazo ou registre a licença em Usuários e acessos.</div>`:`<div class="banner">Período de teste: ${T.rest+1} dia(s) restante(s), até ${fmt(T.fim)}.</div>`):'';
  m.innerHTML=tb+ban+(pode(VIEWMOD[state.view])?VIEWS[state.view]():'<div class="empty"><p>Seu nível de acesso não permite ver nenhum módulo. Procure o administrador.</p></div>');
  if(state.view==='calc')updateCalc();
  if(aid&&aid.startsWith('q-')){const e=document.getElementById(aid);if(e){e.focus();try{e.setSelectionRange(sel,sel)}catch(_){}}}
}
function scheduleRender(){cancelAnimationFrame(rq);rq=requestAnimationFrame(render)}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');
  if(e.target===$('#ov')){closeModal();return}
  if(!b)return;const a=b.dataset.a;
  if(a==='theme'){setTheme(b.dataset.t);return}
  if(a==='logout'){logout();return}
  if(a==='bio'){openBio(false);return}
  if(a==='bio-on'){bioOn();return}
  if(a==='bio-off'){Platform.bioClear();closeModal();toast('Biometria desativada neste aparelho.');render();return}
  if(a==='bio-login'){bioLoginGo();return}
  if(a==='org-reset'){const em=$('#auth input[name=email]')?.value.trim();if(!em){aerr('Digite o e-mail da conta da empresa.');return}try{await Platform.resetSenha(em);state.authMsg='Enviamos um e-mail para redefinir a senha.';render()}catch(_){aerr('Não foi possível enviar o e-mail de redefinição.')}return}
  if(a==='org-logout'){if(await askOk('Desconectar este aparelho da conta da empresa?','Desconectar','Os usuários deste aparelho precisarão conectar a conta da empresa de novo.')){setSession(null);Platform.bioClear();await Platform.signOut()}return}
  if(a==='sobre'){openSobre();return}
  if(a==='minha-senha'){openMinhaSenha();return}
  if(a==='usr-new'){openUserForm(null);return}
  if(a==='usr-edit'){openUserForm(b.dataset.id);return}
  if(a==='usr-reset'){userReset(b.dataset.id);return}
  if(a==='usr-del'){userDel(b.dataset.id);return}
  if(a==='mtx-padrao'){if(isAdm()&&await askOk('Restaurar a matriz de acessos padrão?','Restaurar padrão','As permissões de Master e Usuário voltam à configuração original.')){try{await store.cfg({...state.config,acessos:JSON.parse(JSON.stringify(DEF_ACESSOS))});toast('Matriz restaurada.')}catch(_){}}return}
  if(a==='trial-lic'){if(isAdm()&&await askOk('Registrar a licença definitiva?','Registrar licença','O período de teste é encerrado e o sistema passa a funcionar sem prazo.')){try{await store.cfg({...state.config,trial:{...(state.config.trial||{}),licenciado:true}});toast('Licença definitiva registrada.')}catch(_){}}return}
  if(a==='trial-reabrir'){if(isAdm()){try{await store.cfg({...state.config,trial:{...(state.config.trial||{}),licenciado:false,ativo:true,inicio:today()}});toast('Período de teste reaberto a partir de hoje.')}catch(_){}}return}
  if(a==='fs'){toggleFs();return}
  if(a==='instalar'){openInstalar();return}
  if(a==='inst-pwa'){instalarPWA();return}
  if(a==='nav'){state.view=b.dataset.v;render();window.scrollTo(0,0)}
  else if(a==='sub'){state.sub[b.dataset.p]=b.dataset.s;render()}
  else if(a==='new'){openForm(b.dataset.f,null,b.dataset.w?{trabId:b.dataset.w}:{})}
  else if(a==='edit'){openForm(b.dataset.f,b.dataset.id)}
  else if(a==='del'){const L=LISTS[b.dataset.k];if(!pode(LISTMOD[b.dataset.k],'excluir'))return;if(await ask(`Excluir este registro de ${FORMS[L.form].t}?`,'Excluir registro')){try{await store.del(L.col,b.dataset.id);toast('Registro excluído.')}catch(_){}}}
  else if(a==='ficha'){ficha(b.dataset.id)}
  else if(a==='close'){closeModal()}
  else if(a==='csv'){if(pode('export'))exportCSV(b.dataset.k)}
  else if(a==='rep-open'){if(pode('rel'))openRepForm()}
  else if(a==='rep-close'){closeReport()}
  else if(a==='rep-print'){try{window.print()}catch(_){toast('Impressão bloqueada aqui. Use Baixar relatório.')}}
  else if(a==='rep-dl'){if(lastRep)saveFile(lastRep.file,reportDoc(lastRep),'text/html')}
  else if(a==='sst-sync'){if(pode('integ','editar'))sstSync(false)}
  else if(a==='sst-imp'){sstImportarTrabalhadores()}
  else if(a==='sst-cad'){sstCadastrarUm(b.dataset.sid)}
  else if(a==='calcadd'){state.calc.rows.push({l:'',t:''});render()}
  else if(a==='calcdel'){state.calc.rows.splice(Number(b.dataset.i),1);render()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.a==='search'){state.q[t.dataset.k]=t.value;render();return}
  const c=t.dataset.c;if(!c)return;
  if(c==='l'||c==='t')state.calc.rows[Number(t.dataset.i)][c]=t.value;
  else if(c==='ipvs')state.calc.ipvs=t.checked;else state.calc[c]=t.value;
  updateCalc();
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.a==='sst-ano'){state.sstAno=t.value==='todos'?'todos':Number(t.value);render();return}
  if(t.dataset.a==='sst-ov'){const o={...(state.config.sstOverride||{})};if(t.value)o[t.dataset.id]=t.value;else delete o[t.dataset.id];SSTIDX=null;try{await store.cfg({...state.config,sstOverride:o});toast('Programa do treinamento atualizado.')}catch(_){}return}
if(e.target.dataset.c==='crit'||e.target.dataset.c==='ipvs'){const c=e.target.dataset.c;state.calc[c]=c==='ipvs'?e.target.checked:e.target.value;updateCalc()}});
document.addEventListener('submit',async e=>{
  e.preventDefault();
  const fid=e.target.id;
  if(fid==='f-org'){const f=e.target,btn=f.querySelector('[type=submit]');btn.disabled=true;state.authMsg='';
    try{await Platform.signIn(f.elements.email.value.trim(),f.elements.senha.value)}catch(err){btn.disabled=false;const c=String(err?.code||'');aerr(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)?'E-mail ou senha da conta da empresa incorretos.':/network/.test(c)?'Sem conexão com a internet.':/too-many/.test(c)?'Muitas tentativas. Aguarde alguns minutos.':'Não foi possível conectar: '+(err?.message||c))}return}
  if(['f-setup','f-login','f-troca'].includes(fid)){authSubmit(e.target);return}
  if(fid==='f-minha'){minhaSenhaSubmit(e.target);return}
  if(fid==='f-user'){userSubmit(e.target);return}
  if(fid==='f-padrao'){if(isAdm()){try{await store.cfg({...state.config,senhaPadrao:e.target.elements.senhaPadrao.value.trim()});toast('Senha padrão salva.')}catch(_){}}return}
  if(fid==='f-matriz'){if(!isAdm())return;const ac={master:{},usuario:{}};MODS.forEach(m=>['master','usuario'].forEach(n=>{ac[n][m.k]=m.a.filter(a=>e.target.querySelector(`input[name="${n}|${m.k}|${a}"]`)?.checked)}));
    ['master','usuario'].forEach(n=>MODS.forEach(m=>{if(ac[n][m.k].length&&!ac[n][m.k].includes('ver'))ac[n][m.k].unshift('ver')}));
    try{await store.cfg({...state.config,acessos:ac});toast('Matriz de acessos salva.')}catch(_){}return}
  if(fid==='f-trial'){if(!isAdm())return;const f=e.target;try{await store.cfg({...state.config,trial:{...(state.config.trial||{}),ativo:f.elements.ativo.checked,inicio:f.elements.inicio.value||today(),dias:Math.max(1,Number(f.elements.dias.value)||30),licenciado:false}});toast('Período de teste salvo.')}catch(_){}return}
  if(e.target.id==='frm')submitForm();
  else if(e.target.id==='repf'){const fm=e.target;const progs=fm.querySelector('input[name=prog]:checked').value.split(',');const year=fm.elements.year.value;closeModal();showReport({progs,year})}
  else if(e.target.id==='cfg-sst'){if(!pode('integ','editar'))return;const fm=e.target;try{await store.cfg({...state.config,sstTermosPCA:fm.elements.sstTermosPCA.value.trim(),sstTermosPPR:fm.elements.sstTermosPPR.value.trim(),sstEpiPCA:fm.elements.sstEpiPCA.value.trim(),sstEpiPPR:fm.elements.sstEpiPPR.value.trim()});SSTIDX=null;toast('Termos salvos.');if(sstPossivel())sstSync(false)}catch(_){}}
  else if(e.target.id==='cfg'){if(!pode('config','editar'))return;const fm=e.target,c={...state.config};Object.keys(DEF_CFG).forEach(k=>{if(fm.elements[k]){const v=fm.elements[k].value.trim();c[k]=typeof DEF_CFG[k]==='number'?Math.max(1,Number(v)||DEF_CFG[k]):v}});try{await store.cfg(c);toast('Configurações salvas.')}catch(_){}}
});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('#ov').classList.contains('open'))closeModal();else if($('#rep').classList.contains('open'))closeReport()});

/* ---------- inicialização ---------- */
async function init(){
  try{state.userId=sessionStorage.getItem(SKEY)||null}catch(_){}
  render();
  let d=null;
  try{if(window.claude&&typeof window.claude.use==='function')d=await window.claude.use('db')}catch(_){d=null}
  Platform.bioAvailable().then(v=>{state.bioOk=v;scheduleRender()});
  if(!d&&Platform.firebaseConfigured()){
    state.mode='firebase';
    try{await Platform.fbInit()}catch(e){state.mode='local';loadLocal();state.ready=true;state.dataReady=true;toast('Sem conexão com o Firebase. Usando os dados deste aparelho.');render();return}
    let unsub=[];
    Platform.onAuth(user=>{
      unsub.forEach(f=>{try{f()}catch(_){}});unsub=[];state.fbUser=user||null;state.ready=true;
      if(!user){state.dataReady=false;COLS.forEach(c=>state.data[c]=[]);render();return}
      db=Platform.makeDb();state.dataReady=false;const pend=new Set(COLS);
      COLS.forEach(c=>unsub.push(db.collection(c).onSnapshot(s=>{state.data[c]=s.docs.map(x=>({...x.data(),id:x.id}));pend.delete(c);if(!pend.size)state.dataReady=true;scheduleRender()},
        err=>{pend.delete(c);if(!pend.size)state.dataReady=true;toast('Falha ao carregar '+c+': '+(err?.code||err?.message||''));scheduleRender()})));
      unsub.push(db.doc('config/geral').onSnapshot(s=>{if(s.exists)state.config={...DEF_CFG,...s.data()};scheduleRender()},()=>{}));
      render();sstSync(true);
    });
    return;
  }
  if(d){
    db=d;state.mode='db';state.dataReady=true;const pend=new Set(COLS);
    COLS.forEach(c=>db.collection(c).onSnapshot(s=>{state.data[c]=s.docs.map(x=>({...x.data(),id:x.id}));pend.delete(c);if(!pend.size)state.ready=true;scheduleRender()},
      err=>{pend.delete(c);if(!pend.size)state.ready=true;if(err?.code!=='revoked')toast('Falha ao carregar '+c+'. Recarregue a página.');scheduleRender()}));
    db.doc('config/geral').onSnapshot(s=>{if(s.exists)state.config={...DEF_CFG,...s.data()};scheduleRender()},()=>{});
    setTimeout(()=>{if(!state.ready){state.ready=true;render()}},12000);
  }else{state.mode='local';loadLocal();state.ready=true;state.dataReady=true;render();sstSync(true)}
  try{if(window.claude&&typeof window.claude.use==='function'){downloads=await window.claude.use('downloads');if(downloads)scheduleRender()}}catch(_){}
  try{if(window.claude&&typeof window.claude.use==='function'){const u=await window.claude.use('user');if(u&&u.can){const w=await u.can('data.write');if(w===false){state.readonly=true;scheduleRender()}}}}catch(_){}
}
init();
</script>
